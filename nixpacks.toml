# Nixpacks configuration for CampusCycle on Railway
[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.fileinfo", "php83Extensions.gd", "php83Extensions.bcmath", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link && php artisan optimize:clear && php artisan serve --host=0.0.0.0 --port=$PORT"
